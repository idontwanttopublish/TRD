      <label class="check-toggle"><input type="checkbox" data-cf-type="hns" ${cTypes.includes('hns') ? 'checked' : ''}> HNS SNR confluence</label>
      <div class="dir-field" style="margin:10px 0 14px;">
        <div class="dir-field-label" style="font-size:12px;color:#5B6472;">HNS timeframe</div>
        <select class="form-input" data-cfield="hns-timeframe">${tfOptions(c.hns && c.hns.timeframe)}</select>
        <div class="dir-field-label" style="font-size:12px;color:#5B6472;margin-top:8px;">HNS fresh</div>
        <select class="form-input" data-cfield="hns-fresh">
          <option value="">—</option>
          ${opt('Yes', c.hns && c.hns.fresh)}
          ${opt('No', c.hns && c.hns.fresh)}
        </select>
      </div>
      <label class="check-toggle"><input type="checkbox" data-cf-type="tl" ${cTypes.includes('tl') ? 'checked' : ''}> TL confluence</label>
      <div class="dir-field" style="margin-top:10px;">
        <div class="dir-field-label" style="font-size:12px;color:#5B6472;">TL mode</div>
        <select class="form-input" data-cfield="tlMode">
          <option value="">—</option>
          ${opt('single', c.tlMode)}
          ${opt('kiss', c.tlMode)}
        </select>
        <div class="dir-field-label" style="font-size:12px;color:#5B6472;margin-top:8px;">TL 1 — timeframe / type</div>
        <select class="form-input" data-cfield="tl1-timeframe">${tfOptions(c.tl1 && c.tl1.timeframe)}</select>
        <select class="form-input" data-cfield="tl1-type" style="margin-top:6px;">${tlTypeOptions(c.tl1 && c.tl1.type)}</select>
        <div class="dir-field-label" style="font-size:12px;color:#5B6472;margin-top:8px;">TL 2 — timeframe / type (kiss only)</div>
        <select class="form-input" data-cfield="tl2-timeframe">${tfOptions(c.tl2 && c.tl2.timeframe)}</select>
        <select class="form-input" data-cfield="tl2-type" style="margin-top:6px;">${tlTypeOptions(c.tl2 && c.tl2.type)}</select>
      </div>
    </div>
  `;

  const tradeEditHTML = `
    <div class="dir-field-label" style="margin-bottom:9px;">Status</div>
    <div class="chip-select" style="margin-bottom:16px;">
      <div class="chip-option ${(e.status || 'marked') === 'marked' ? 'selected' : ''}" data-detail-status="marked">Marked</div>
      <div class="chip-option ${e.status === 'open' ? 'selected' : ''}" data-detail-status="open">Open</div>
      <div class="chip-option ${e.status === 'closed' ? 'selected' : ''}" data-detail-status="closed">Closed</div>
    </div>
    <div class="form-grid">
      <input class="form-input" placeholder="Symbol / pair" data-tfield="symbol" value="${e.trade.symbol || ''}">
      <input class="form-input" type="number" step="any" placeholder="Risk %" data-tfield="riskPercent" value="${e.trade.riskPercent ?? ''}">
      <input class="form-input" type="number" step="any" placeholder="Entry price" data-tfield="entryPrice" value="${e.trade.entryPrice ?? ''}">
      <input class="form-input" type="number" step="any" placeholder="Stop loss" data-tfield="stopLoss" value="${e.trade.stopLoss ?? ''}">
      <input class="form-input span-2" type="number" step="any" placeholder="Take profit" data-tfield="takeProfit" value="${e.trade.takeProfit ?? ''}">
    </div>
    <textarea class="form-input" rows="2" placeholder="Notes (optional)" data-tfield="notes">${e.trade.notes || ''}</textarea>
  `;

  return `
    <div class="detail-section">
      <div class="detail-heading">Direction · ${e.setupGrade ? e.setupGrade.label + ' · ' + e.setupPoints + ' pts' : ''}${e.tradeScoreLabel ? ' · Score ' + (e.tradeScore ?? 0) + '/' + (e.tradeScoreMax ?? '—') + ' (' + e.tradeScoreLabel.label + ')' : ''}</div>
      <div class="kv-grid">${dirRows}</div>
    </div>
    <div class="detail-section">
      <div class="detail-heading">Setup — ${e.setupTypeLabel || 'none'}</div>
      <div class="kv-grid">${setupRows}</div>
    </div>
    <div class="detail-section">
      <div class="detail-heading">Zone size — ${zoneSizeLabel}</div>
      <div class="kv-grid">${preciseRows}</div>
    </div>
    <div class="detail-section">
      <div class="detail-heading">Trade details <span style="font-weight:400;color:#5B6472;font-size:12px;">(editable)</span></div>
      ${tradeEditHTML}
    </div>
    <div class="detail-section">
      <div class="detail-heading">Confluence <span style="font-weight:400;color:#5B6472;font-size:12px;">(editable)</span></div>
      ${confluenceEditHTML}
      <button class="btn-next go" data-save-details="${e.id}" style="width:100%;margin-top:14px;">Save details</button>
    </div>
    <div class="detail-section">
      <div class="detail-heading">Daily open &amp; timing/risk checks</div>
      ${checksHTML(e.dailyOpenChecks)}
      ${checksHTML(e.timingRiskChecks)}
    </div>
    <div class="detail-section">
      <div class="detail-heading">Outcome</div>
      <div class="outcome-form">
        <select class="form-input" data-outcome-field="status" data-id="${e.id}">
          <option value="open" ${o.status === 'open' ? 'selected' : ''}>Open</option>
          <option value="win" ${o.status === 'win' ? 'selected' : ''}>Win</option>
          <option value="loss" ${o.status === 'loss' ? 'selected' : ''}>Loss</option>
          <option value="breakeven" ${o.status === 'breakeven' ? 'selected' : ''}>Breakeven</option>
        </select>
        <input class="form-input" type="number" step="any" placeholder="Exit price" data-outcome-field="exitPrice" data-id="${e.id}" value="${o.exitPrice ?? ''}">
        <input class="form-input" type="number" step="any" placeholder="P/L amount" data-outcome-field="pnl" data-id="${e.id}" value="${o.pnl ?? ''}">
        <input class="form-input" type="number" step="any" placeholder="R multiple" data-outcome-field="rMultiple" data-id="${e.id}" value="${o.rMultiple ?? ''}">
        <textarea class="form-input span-2" rows="2" placeholder="Outcome notes" data-outcome-field="notes" data-id="${e.id}">${o.notes || ''}</textarea>
      </div>
      <div class="entry-actions">
        <button class="btn-next go" data-save-outcome="${e.id}" style="flex:2;">Save outcome</button>
        <button class="btn-next reset" data-delete-entry="${e.id}" style="color:#F2565C;border-color:#4A1E22;">Delete</button>
      </div>
    </div>
  `;
}

function entryRowHTML(e) {
  const expanded = expandedEntryId === e.id;
  return `
    <div class="entry-row ${expanded ? 'expanded' : ''}" data-entry-id="${e.id}">
      <div class="entry-row-head" data-toggle-entry="${e.id}">
        <div class="entry-row-main">
          <div class="entry-row-top">
            <span class="entry-symbol">${e.trade.symbol || 'Unnamed'}</span>
            <span class="tag ${e.verdict === 'GO' ? 'go' : 'nogo'}">${e.verdict}</span>
            ${e.side ? `<span class="tag ${e.side.toLowerCase()}">${e.side}</span>` : ''}
            ${e.tradeScoreLabel ? `<span class="score-badge ${e.tradeScoreLabel.cls}" style="padding:2px 8px;font-size:11px;">${e.tradeScoreLabel.label}</span>` : ''}
            ${e.verdict === 'GO' ? outcomeTag(e) : ''}
          </div>
          <div class="entry-meta">${e.date} · ${e.day} · ${e.time} · ${e.setupTypeLabel || 'no setup'}${e.setupGrade ? ' · ' + e.setupGrade.label : ''}</div>
        </div>
        <i class="ti ti-chevron-right entry-chevron" aria-hidden="true"></i>
      </div>
      <div class="entry-detail">${expanded ? entryDetailHTML(e) : ''}</div>
    </div>
  `;
}

function renderJournalDashboard() {
  renderJournalToolbar();
  updateNavCount();
  const entries = filteredEntries();
  const stats = computeStats(entries);
  const body = document.getElementById('journalBody');

  if (getJournal().length === 0) {
    body.innerHTML = `<div class="empty-journal"><i class="ti ti-notebook" aria-hidden="true"></i>No trades logged yet.<br>Complete a checklist and save a GO trade to start building your journal.</div>`;
    return;
  }

  const chartsAvailable = typeof Chart !== 'undefined';
  let html = statCardsHTML(stats);
  if (!chartsAvailable) {
    html += `<div class="empty-journal" style="margin-bottom:18px;"><i class="ti ti-chart-bar" aria-hidden="true"></i>Charts couldn't load (the Chart.js library didn't come through from the CDN — check your internet connection). Your stats and trade list below are unaffected.</div>`;
  } else {
    html += `
    <div class="chart-grid">
      <div class="chart-card full"><div class="chart-title">Equity curve (cumulative P/L)</div><canvas id="chartEquity"></canvas></div>
      <div class="chart-card"><div class="chart-title">Outcome mix</div><canvas id="chartOutcome"></canvas></div>
      <div class="chart-card"><div class="chart-title">Win rate by setup type</div><canvas id="chartBySetup"></canvas></div>
      <div class="chart-card"><div class="chart-title">Win rate by direction bias</div><canvas id="chartByBias"></canvas></div>
      <div class="chart-card"><div class="chart-title">Trades by day of week</div><canvas id="chartByDay"></canvas></div>
      <div class="chart-card full"><div class="chart-title">Grade distribution</div><canvas id="chartByGrade"></canvas></div>
    </div>`;
  }
  html += `<div class="entry-list">${entries.length ? entries.map(entryRowHTML).join('') : '<div class="empty-journal">No entries match these filters.</div>'}</div>`;
  body.innerHTML = html;

  if (chartsAvailable) {
    ensureChartDefaults();
    destroyCharts();
    renderCharts(entries, stats);
  }

  body.querySelectorAll('[data-toggle-entry]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-toggle-entry');
      expandedEntryId = expandedEntryId === id ? null : id;
      renderJournalDashboard();
    });
  });

  body.querySelectorAll('[data-detail-status]').forEach(el => {
    el.addEventListener('click', () => {
      el.parentElement.querySelectorAll('[data-detail-status]').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  body.querySelectorAll('[data-save-details]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-save-details');
      const container = body.querySelector(`.entry-row[data-entry-id="${id}"]`);

      const statusChip = container.querySelector('[data-detail-status].selected');
      const status = statusChip ? statusChip.getAttribute('data-detail-status') : 'marked';

      const trade = {};
      container.querySelectorAll('[data-tfield]').forEach(field => {
        const key = field.getAttribute('data-tfield');
        let val = field.value;
        if (['riskPercent', 'entryPrice', 'stopLoss', 'takeProfit'].includes(key)) {
          val = val === '' ? null : parseFloat(val);
        } else {
          val = val.trim();
        }
        trade[key] = val;
      });

      const cf = container.querySelector('.editable-confluence');
      const getVal = (sel) => { const f = cf.querySelector(`[data-cfield="${sel}"]`); return f && f.value ? f.value : null; };
      const types = [];
      cf.querySelectorAll('[data-cf-type]').forEach(cb => { if (cb.checked) types.push(cb.getAttribute('data-cf-type')); });
      const confluence = {
        types,
        hns: { timeframe: getVal('hns-timeframe'), fresh: getVal('hns-fresh') },
        tlMode: getVal('tlMode'),
        tl1: { timeframe: getVal('tl1-timeframe'), type: getVal('tl1-type') },
        tl2: { timeframe: getVal('tl2-timeframe'), type: getVal('tl2-type') }
      };

      updateJournalEntry(id, { status, trade, confluence });
      renderJournalDashboard();
    });
  });

  body.querySelectorAll('[data-save-outcome]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-save-outcome');
      const container = body.querySelector(`.entry-row[data-entry-id="${id}"]`);
      const patch = { outcome: {} };
      container.querySelectorAll('[data-outcome-field]').forEach(field => {
        const key = field.getAttribute('data-outcome-field');
        let val = field.value;
        if (['exitPrice', 'pnl', 'rMultiple'].includes(key)) {
          val = val === '' ? null : parseFloat(val);
        }
        patch.outcome[key] = val;
      });
      if (patch.outcome.status !== 'open') patch.outcome.closedAt = new Date().toISOString();
      updateJournalEntry(id, patch);
      renderJournalDashboard();
    });
  });

  body.querySelectorAll('[data-delete-entry]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-delete-entry');
      if (confirm('Delete this journal entry? This cannot be undone.')) {
        deleteJournalEntry(id);
        expandedEntryId = null;
        renderJournalDashboard();
      }
    });
  });
}

document.getElementById('tabChecklist').addEventListener('click', () => switchView('checklist'));
document.getElementById('tabJournal').addEventListener('click', () => switchView('journal'));

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const label = String(h % 24).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  document.getElementById('clockOut').textContent = label;

  const startMin = 10 * 60;
  const endMin = 22 * 60;
  const curMin = h * 60 + m;
  let pct = ((curMin - startMin) / (endMin - startMin)) * 100;
  pct = Math.max(0, Math.min(100, pct));
  document.getElementById('sessionFill').style.width = pct + '%';
}

updateClock();
setInterval(updateClock, 30000);

renderStep();
renderRail();
renderOverallBanner();
updateNavCount();
</script>
</body>
