<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Trade Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0B0D11;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(217,131,46,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(52,201,127,0.05), transparent 55%);
    background-attachment: fixed;
    font-family: 'Inter', sans-serif;
    color: #EEF0F4;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #D9832E;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: '';
    width: 14px;
    height: 1.5px;
    background: #D9832E;
    display: inline-block;
  }

  h1 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 6px 0 2px;
    letter-spacing: -0.015em;
  }

  .session-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    margin-bottom: 4px;
  }

  .session-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #5B6472;
  }

  .session-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8A93A3;
  }

  .session-track {
    position: relative;
    height: 4px;
    background: #20252E;
    background-image: repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(0,0,0,0.5) 23px, rgba(0,0,0,0.5) 24px);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .session-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #B36A22, #D9832E);
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px rgba(217,131,46,0.5);
  }

  .overall-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #262B35;
    background: #14181F;
    border-radius: 14px;
    padding: 13px 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
  }

  .overall-left { display: flex; flex-direction: column; gap: 3px; }

  .overall-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5B6472;
  }

  .overall-sub {
    font-size: 12px;
    color: #838C9C;
  }

  .overall-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  .overall-badge.bullish { background: #10201A; color: #34C97F; border: 1px solid #1F4A38; }
  .overall-badge.bearish { background: #201113; color: #F2565C; border: 1px solid #4A1E22; }
  .overall-badge.sideways { background: #241D0E; color: #E8B34A; border: 1px solid #4A3C18; }
  .overall-badge.mixed { background: #20252E; color: #8A93A3; border: 1px solid #3A4150; }
  .overall-badge.pending { background: #14181F; color: #4A5261; border: 1px solid #262B35; }

  .dir-field { margin-bottom: 18px; }

  .dir-field-label {
    font-size: 14px;
    font-weight: 500;
    color: #B9C0CC;
    margin-bottom: 9px;
  }

  .dir-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .dir-card {
    text-align: center;
    padding: 14px 6px;
    border: 1px solid #262B35;
    border-radius: 10px;
    background: #10131A;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  .dir-card:active { transform: scale(0.98); }

  .dir-card i { font-size: 18px; display: block; margin-bottom: 6px; color: #5B6472; }
  .dir-card span { font-size: 12px; font-weight: 600; color: #838C9C; }

  .dir-card.sel-bullish { background: #10201A; border-color: #34C97F; }
  .dir-card.sel-bullish i, .dir-card.sel-bullish span { color: #34C97F; }

  .dir-card.sel-bearish { background: #201113; border-color: #F2565C; }
  .dir-card.sel-bearish i, .dir-card.sel-bearish span { color: #F2565C; }

  .dir-card.sel-sideways { background: #241D0E; border-color: #E8B34A; }
  .dir-card.sel-sideways i, .dir-card.sel-sideways span { color: #E8B34A; }

  .side-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .side-card {
    text-align: center;
    padding: 26px 6px;
    border: 1px solid #262B35;
    border-radius: 12px;
    background: #10131A;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  .side-card:active { transform: scale(0.98); }

  .side-card i { font-size: 24px; display: block; margin-bottom: 8px; color: #5B6472; }
  .side-card span { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #838C9C; }

  .side-card.sel-buy { background: #10201A; border-color: #34C97F; }
  .side-card.sel-buy i, .side-card.sel-buy span { color: #34C97F; }

  .side-card.sel-sell { background: #201113; border-color: #F2565C; }
  .side-card.sel-sell i, .side-card.sel-sell span { color: #F2565C; }

  .side-card.selected { background: #251A0D; border-color: #D9832E; }
  .side-card.selected i, .side-card.selected span { color: #E8A661; }

  .chip-select {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip-option {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid #262B35;
    background: #10131A;
    color: #838C9C;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  .chip-option:active { transform: scale(0.97); }

  .chip-option.selected {
    background: #251A0D;
    border-color: #D9832E;
    color: #E8A661;
  }

  .setup-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .setup-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 1px solid #262B35;
    border-radius: 12px;
    background: #10131A;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  .setup-card:active { transform: scale(0.99); }

  .setup-card.selected { border-color: #34C97F; background: #10201A; }

  .setup-icon {
    width: 36px; height: 36px; border-radius: 9px;
    background: #1B1F28;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .setup-icon i { font-size: 17px; color: #838C9C; }
  .setup-card.selected .setup-icon { background: #12241C; }
  .setup-card.selected .setup-icon i { color: #34C97F; }

  .setup-mid { flex: 1; min-width: 0; }
  .setup-name { font-size: 14px; font-weight: 600; color: #EEF0F4; }
  .setup-status { font-size: 12px; color: #5B6472; margin-top: 2px; }
  .setup-card.selected .setup-status { color: #34C97F; }
  .setup-chevron { color: #5B6472; font-size: 16px; flex-shrink: 0; }

  .setup-detail-head {
    display: flex; align-items: center; gap: 6px; margin-bottom: 16px; cursor: pointer; user-select: none;
  }
  .setup-detail-head span { font-size: 13px; color: #838C9C; font-weight: 500; }
  .setup-detail-head i { font-size: 16px; color: #838C9C; }

  .setup-detail-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
  .setup-detail-sub { font-size: 13px; color: #838C9C; margin-bottom: 18px; }

  .grade-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }
  .grade-badge.a { background: #251A0D; color: #E8A661; border: 1px solid #D9832E; }
  .grade-badge.aplus { background: #10201A; color: #34C97F; border: 1px solid #34C97F; }
  .grade-badge.golden { background: #241D0E; color: #EFC24E; border: 1px solid #EFC24E; }
  .grade-badge.pts { background: #1B1F28; color: #8A93A3; border: 1px solid #3A4150; }
  .setup-name .grade-badge { margin-left: 6px; }

  .points-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .top-points-badge {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 50;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .placeholder-box {
    text-align: center;
    padding: 34px 18px;
    color: #5B6472;
    font-size: 13px;
    line-height: 1.6;
    border: 1px dashed #2A303B;
    border-radius: 12px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .risk-alert {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid #4A3C18;
    background: #241D0E;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .risk-alert i { color: #E8B34A; font-size: 17px; margin-top: 1px; flex-shrink: 0; }
  .risk-alert span { font-size: 13px; line-height: 1.5; color: #E8B34A; font-weight: 500; }
  .risk-alert strong { color: #F3C978; }

  .risk-alert.block-alert { border-color: #4A1E22; background: #201113; }
  .risk-alert.block-alert i, .risk-alert.block-alert span { color: #F2565C; }
  .risk-alert.block-alert strong { color: #F98287; }

  .score-panel {
    border: 1px solid #262B35;
    background: #14181F;
    border-radius: 14px;
    padding: 16px;
    margin: 16px 0;
  }
  .score-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .score-panel-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6472; }
  .score-total { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8A93A3; }

  .score-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }
  .score-badge.risky { background: #201113; color: #F2565C; border: 1px solid #4A1E22; }
  .score-badge.good { background: #241D0E; color: #E8B34A; border: 1px solid #4A3C18; }
  .score-badge.aplus { background: #10201A; color: #34C97F; border: 1px solid #1F4A38; }

  .score-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: #B9C0CC; padding: 5px 0; }
  .score-row-pts { font-family: 'JetBrains Mono', monospace; color: #8A93A3; }
  .score-row-pts.earned { color: #34C97F; }

  .check-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #B9C0CC; cursor: pointer; user-select: none; }
  .check-toggle input { width: 16px; height: 16px; accent-color: #D9832E; cursor: pointer; }

  .rail {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .tick {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #20252E;
    transition: background 0.25s ease;
  }

  .tick.done { background: #34C97F; }
  .tick.fail { background: #F2565C; }
  .tick.current { background: #D9832E; }

  .card {
    background: #14181F;
    border: 1px solid #262B35;
    border-radius: 16px;
    padding: 22px 20px 20px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 20px 40px -24px rgba(0,0,0,0.7);
  }

  .step-count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .step-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #5B6472;
    letter-spacing: 0.06em;
  }

  .field-note {
    font-size: 12px;
    line-height: 1.5;
    color: #838C9C;
    background: #1B1F28;
    border: 1px solid #2A303B;
    border-radius: 8px;
    padding: 8px 10px;
    margin: -3px 0 9px;
  }

  .step-title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }

  .step-sub {
    font-size: 13px;
    color: #838C9C;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .items {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border: 1px solid #262B35;
    border-radius: 12px;
    background: #10131A;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .item:hover { border-color: #3A4150; }
  .item:active { transform: scale(0.99); }

  .item.checked {
    border-color: #2C5942;
    background: linear-gradient(180deg, rgba(52,201,127,0.09), rgba(52,201,127,0.03));
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
  }

  .box {
    flex-shrink: 0;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    border: 2px solid #3A4150;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
  }

  .item.checked .box {
    background: #34C97F;
    border-color: #34C97F;
    box-shadow: 0 0 0 4px rgba(52,201,127,0.14);
    animation: tick-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tick-pop {
    0% { transform: scale(0.8); }
    55% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .box i {
    font-size: 14px;
    font-weight: 700;
    color: #0B0D11;
    opacity: 0;
    transform: scale(0.4) rotate(-20deg);
    transition: opacity 0.14s ease 0.05s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
  }

  .item.checked .box i { opacity: 1; transform: scale(1) rotate(0deg); }

  .item-label {
    font-size: 14px;
    line-height: 1.45;
    color: #B9C0CC;
  }

  .item.checked .item-label { color: #EEF0F4; }

  .nav {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 11px;
    padding: 13px 16px;
    border: 1px solid #2A303B;
    background: transparent;
    color: #B9C0CC;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover { border-color: #3A4150; color: #EEF0F4; }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid #D9832E; outline-offset: 2px; }

  .btn-back {
    flex: 0 0 auto;
    width: 46px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #838C9C;
  }
  .btn-back:hover { color: #EEF0F4; }
  .btn-back svg { display: block; }
  .btn-next {
    flex: 1;
    background: #D9832E;
    border-color: #D9832E;
    color: #14181F;
    text-align: center;
    box-shadow: 0 8px 20px -10px rgba(217,131,46,0.55);
  }

  .btn-next:hover { background: #E39440; border-color: #E39440; color: #14181F; }

  .btn-next:disabled {
    background: #1B1C1F;
    border-color: #262B35;
    color: #4A5261;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-next:disabled:hover { background: #1B1C1F; border-color: #262B35; color: #4A5261; }

  .btn-next.go { background: #34C97F; border-color: #34C97F; color: #0B0D11; box-shadow: 0 8px 20px -10px rgba(52,201,127,0.5); }
  .btn-next.go:hover { background: #45D48D; border-color: #45D48D; }
  .btn-next.reset { background: transparent; border-color: #3A4150; color: #B9C0CC; box-shadow: none; }

  .verdict {
    text-align: center;
    padding: 10px 0 4px;
  }

  .verdict-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 26px;
    border-radius: 10px;
    margin-bottom: 14px;
  }

  .verdict-badge.go {
    background: #10201A;
    color: #34C97F;
    border: 1px solid #1F4A38;
  }

  .verdict-badge.nogo {
    background: #201113;
    color: #F2565C;
    border: 1px solid #4A1E22;
  }

  .verdict-sub {
    font-size: 13px;
    color: #838C9C;
    margin-bottom: 20px;
  }

  .fail-list {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }

  .fail-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 13px;
    color: #B9C0CC;
    padding: 10px 12px;
    background: #10131A;
    border: 1px solid #262B35;
    border-radius: 8px;
  }

  .fail-item i { color: #F2565C; font-size: 15px; margin-top: 1px; flex-shrink: 0; }

  .reminder-block {
    text-align: left;
    background: #10131A;
    border: 1px solid #262B35;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }

  .reminder-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5B6472;
    margin-bottom: 8px;
  }

  .reminder-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid #1B1F28;
  }
  .reminder-row:last-child { border-bottom: none; }
  .reminder-row span:first-child { color: #838C9C; }
  .reminder-row span:last-child { color: #EEF0F4; font-family: 'JetBrains Mono', monospace; }

  /* ---- Shell / nav ---- */
  .shell { width: 100%; max-width: 460px; transition: max-width 0.2s ease; }
  .shell.wide { max-width: 920px; }

  .top-nav {
    display: flex;
    gap: 6px;
    background: #14181F;
    border: 1px solid #262B35;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .nav-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #838C9C;
    font-size: 13px;
    font-weight: 600;
  }

  .nav-tab i { font-size: 15px; }

  .nav-tab.active { background: #251A0D; color: #E8A661; }

  .nav-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: #262B35;
    color: #8A93A3;
    border-radius: 20px;
    padding: 1px 7px;
    margin-left: 2px;
  }

  .nav-tab.active .nav-count { background: #D9832E; color: #fff; }

  /* ---- Journal save block on verdict ---- */
  .journal-save-block {
    text-align: left;
    background: #10131A;
    border: 1px solid #262B35;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }

  .journal-save-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5B6472;
    margin-bottom: 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 13px;

</head>
<body>
<div class="top-points-badge" id="topPointsBadge"></div>
<div class="shell" id="shell">

  <div class="top-nav">
    <button class="nav-tab active" id="tabChecklist" data-view="checklist"><i class="ti ti-clipboard-check" aria-hidden="true"></i> Checklist</button>
    <button class="nav-tab" id="tabJournal" data-view="journal"><i class="ti ti-notebook" aria-hidden="true"></i> Journal<span class="nav-count" id="navCount"></span></button>
  </div>

    <div class="eyebrow">Before you enter</div>
    <h1>Pre-trade checklist</h1>

    <div class="session-line">
      <span class="session-label">SESSION 10:00–22:00</span>
      <span class="session-time" id="clockOut">--:--</span>
    </div>
    <div class="session-track"><div class="session-fill" id="sessionFill"></div></div>

    <div class="overall-banner" id="overallBanner"></div>

    <div class="rail" id="rail"></div>

    <div class="card" id="card"></div>

  </div>

  <div class="journal-view" id="viewJournal" style="display:none;">
    <div class="eyebrow">Trade history</div>
    <h1>Journal &amp; dashboard</h1>
    <div class="journal-toolbar" id="journalToolbar"></div>
    <div class="journal-body" id="journalBody"></div>
  </div>

</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
const DIR_OPTIONS = [
  { val: "Bullish", icon: "ti-trending-up" },
  { val: "Bearish", icon: "ti-trending-down" },
  { val: "Sideways", icon: "ti-arrows-horizontal" }
];

const directionStep = {
  title: "Direction",
  sub: "Read each timeframe on its own, then see if they agree.",
  type: "direction",
  fields: [
    { key: "h4tl", label: "H4 TL direction" },
    { key: "h4bo", label: "H4 2BO direction" },
    { key: "h1structure", label: "H1 HH/HL structure" }
  ]
};

let directionState = { h4tl: null, h4bo: null, h1structure: null };

function overallBias() {
  const vals = Object.values(directionState);
  const setCount = vals.filter(Boolean).length;
  if (setCount < 3) return { label: "Not set", cls: "pending", sub: `${setCount}/3 selected` };

  const counts = {};
  vals.forEach(v => counts[v] = (counts[v] || 0) + 1);
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const [topVal, topCount] = entries[0];

  if (topCount === 3) return { label: topVal, cls: topVal.toLowerCase(), sub: "3/3 aligned" };
  if (topCount === 2) return { label: topVal, cls: topVal.toLowerCase(), sub: "2/3 majority — one disagrees" };
  return { label: "Mixed", cls: "mixed", sub: "All three disagree" };
}

function renderOverallBanner() {
  const b = overallBias();
  document.getElementById('overallBanner').innerHTML = `
    <div class="overall-left">
      <div class="overall-label">Overall direction</div>
      <div class="overall-sub">${b.sub}</div>
    </div>
    <div class="overall-badge ${b.cls}">${b.label}</div>
  `;
}

function directionSetupAligned() {
  const bias = overallBias();
  if (bias.label === 'Bullish' && setupSide === 'Buy') return true;
  if (bias.label === 'Bearish' && setupSide === 'Sell') return true;
  return false;
}

// True only when all 3 direction signals agree with each other (3/3), regardless of setup side.
function allDirectionsAligned() {
  const vals = Object.values(directionState);
  if (vals.some(v => !v)) return false;
  return vals[0] === vals[1] && vals[1] === vals[2];
}

// How many of the 3 direction signals (h4tl, h4bo, h1structure) point the same way as the setup side.
// Buy wants Bullish, Sell wants Bearish. Returns null if no side picked yet.
function directionAlignCount(side) {
  if (!side) return null;
  const wanted = side === 'Buy' ? 'Bullish' : side === 'Sell' ? 'Bearish' : null;
  if (!wanted) return null;
  return Object.values(directionState).filter(v => v === wanted).length;
}

// Point weights — tune these to change how much each factor is worth.
const GRADE_POINTS = {
  alignment: 30,   // direction matches setup side (e.g. Bullish + Buy)
  qm: 30,          // QM Setup = Yes
  hsl: 25,         // HSL = Yes
  extra: 15,       // each additional quality "Yes" (BPE: Zone used in 2 TF)
  timeframe: 15    // setup timeframe is H1, M30, or M15
};

// Overall trade score — shown on the verdict page as Risky / Good / A+.
const TRADE_SCORE_POINTS = {
  allDirectionsAligned: 1,   // all 3 direction signals agree with each other
  setupDirectionAligned: 1, // setup side matches the overall bias
  setupType: { bpe: 2, hns: 1, tl: 1 }, // BPE is worth more than HNS/TL
  confluence: {
    tlKiss: 2,    // TL confluence in "kiss" mode (2 trendlines) — best
    tlSingle: 1,  // TL confluence, single trendline — less than kiss
    hnsFresh: 2,  // HNS SNR confluence, fresh — best
    hnsStale: 1   // HNS SNR confluence, not fresh
  }
};
const TRADE_SCORE_MAX = TRADE_SCORE_POINTS.allDirectionsAligned
  + TRADE_SCORE_POINTS.setupDirectionAligned
  + TRADE_SCORE_POINTS.setupType.bpe
  + TRADE_SCORE_POINTS.confluence.tlKiss + TRADE_SCORE_POINTS.confluence.hnsFresh;

function confluencePoints() {
  let pts = 0;
  if (confluenceState.types.includes('hns')) {
    pts += confluenceState.hns.fresh === 'Yes' ? TRADE_SCORE_POINTS.confluence.hnsFresh : TRADE_SCORE_POINTS.confluence.hnsStale;
  }
  if (confluenceState.types.includes('tl')) {
    pts += confluenceState.tlMode === 'kiss' ? TRADE_SCORE_POINTS.confluence.tlKiss : TRADE_SCORE_POINTS.confluence.tlSingle;
  }
  return pts;
}

function tradeScoreBreakdown() {
  const items = [];
  items.push({ label: 'All 3 direction signals aligned', pts: allDirectionsAligned() ? TRADE_SCORE_POINTS.allDirectionsAligned : 0, max: TRADE_SCORE_POINTS.allDirectionsAligned });
  items.push({ label: 'Setup side aligned with direction', pts: directionSetupAligned() ? TRADE_SCORE_POINTS.setupDirectionAligned : 0, max: TRADE_SCORE_POINTS.setupDirectionAligned });
  const setupMax = selectedSetupKey ? TRADE_SCORE_POINTS.setupType[selectedSetupKey] : 0;
  items.push({ label: 'Setup type' + (selectedSetupKey ? ' (' + SETUP_TYPES[selectedSetupKey].label + ')' : ''), pts: setupMax, max: TRADE_SCORE_POINTS.setupType.bpe });
  items.push({ label: 'Confluence quality', pts: confluencePoints(), max: TRADE_SCORE_POINTS.confluence.tlKiss + TRADE_SCORE_POINTS.confluence.hnsFresh });
  return items;
}

function tradeScore() {
  return tradeScoreBreakdown().reduce((sum, i) => sum + i.pts, 0);
}

function tradeScoreClass(score) {
  if (score >= 6) return { label: 'A+', cls: 'aplus' };
  if (score >= 3) return { label: 'Good', cls: 'good' };
  return { label: 'Risky', cls: 'risky' };
}

const GOOD_TIMEFRAMES = ["H1", "M30", "M15"];

const TF_OPTIONS = ["M5", "M15", "M30", "H1", "H4", "D1"];
const TL_TYPES = ["Type 1", "Type 2", "Type 3", "Type 4", "Type 5", "Type 6", "Type 7"];
const HSL_NOTE = "HSL is the night-market zone — the previous market's vertical-line level.";

const SETUP_TYPES = {
  bpe: {
    label: "BPE",
    sub: "Breakout pullback entry — historical or current market price.",
    icon: "ti-arrow-back-up",
    fields: [
      { key: "reference", label: "Reference", options: ["Historical", "CMP"] },
      { key: "qmSetup", label: "QM", options: ["Yes", "No"] },
      { key: "hslAvailable", label: "HSL", options: ["Yes", "No"], note: HSL_NOTE },
      { key: "zoneUsed2TF", label: "ZONE USED 2 TF BELOW", options: ["Yes", "No"] },
      { key: "timeframe", label: "Timeframe of exact zone", options: TF_OPTIONS }
    ]
  },
  hns: {
    label: "HNS",
    sub: "2-candle break — V or A shape, not an M.",
    icon: "ti-chart-line",
    fields: [
      { key: "timeframe", label: "Timeframe", options: TF_OPTIONS },
      { key: "qmSetup", label: "QM Setup?", options: ["Yes", "No"] },
      { key: "hsl", label: "HSL?", options: ["Yes", "No"], showIf: d => d.qmSetup === 'Yes', note: HSL_NOTE }
    ]
  },
  tl: {
    label: "TL",
    sub: "Trend line break, by type.",
    icon: "ti-trending-up",
    fields: [
      { key: "tlType", label: "TL type", options: TL_TYPES },
      { key: "timeframe", label: "Timeframe", options: TF_OPTIONS },
      { key: "qmSetup", label: "QM Setup?", options: ["Yes", "No"] },
      { key: "hsl", label: "HSL?", options: ["Yes", "No"], showIf: d => d.qmSetup === 'Yes', note: HSL_NOTE }
    ]
  }
};

let setupState = {
  bpe: { reference: null, timeframe: null, hslAvailable: null, zoneUsed2TF: null, qmSetup: null },
  hns: { timeframe: null, qmSetup: null, hsl: null },
  tl: { tlType: null, timeframe: null, qmSetup: null, hsl: null }
};
let selectedSetupKey = null;
let setupDetailKey = null;
let setupSide = null;
let preciseState = {
  types: [],
  isl: { dropTF: null },
  hns: { dropTF: null }
};
let zoneSizeState = { size: null };

function getTwoTFsBelow(baseTF) {
  if (!baseTF) return [];
  const idx = TF_OPTIONS.indexOf(baseTF);
  if (idx <= 0) return [];
  const result = [];
  if (idx - 1 >= 0) result.push(TF_OPTIONS[idx - 1]);
  if (idx - 2 >= 0) result.push(TF_OPTIONS[idx - 2]);
  return result;
}

function zoneSizeComplete() {
  return !!zoneSizeState.size;
}

function preciseNeeded() {
  return zoneSizeState.size === '50+';
}

function preciseComplete() {
  if (!preciseNeeded()) return true;
  if (preciseState.types.length === 0) return false;
  return preciseState.types.every(t => {
    const d = preciseState[t];
    if (!d.dropTF) return false;
    return true;
  });
}

function renderPreciseBlock(title, key, noteText) {
  const data = preciseState[key];
  let h = `<div class="setup-detail-title" style="margin-top:6px;">${title}</div>`;

  const baseTF = selectedSetupKey ? setupState[selectedSetupKey].timeframe : null;
  const lowerTFs = getTwoTFsBelow(baseTF);
  // HNS Precise shows the exact zone timeframe itself plus its 2 lower timeframes (3 total).
  // ISL Precise keeps the original behavior: just the 2 lower timeframes.
  const tfChoices = key === 'hns' && baseTF ? [baseTF, ...lowerTFs] : lowerTFs;

  h += `<div class="setup-detail-title" style="font-size:14px;margin-top:2px;">Drop Time Frame 2 Times Maximum</div>`;
  h += `<div class="field-note">${noteText}</div>`;
  if (tfChoices.length === 0) {
    h += `<div class="placeholder-box">Pick a timeframe on the Setup step first.</div>`;
  } else {
    h += `<div class="chip-select">`;
    tfChoices.forEach(tf => {
      const sel = data.dropTF === tf ? 'selected' : '';
      const isExact = key === 'hns' && tf === baseTF;
      h += `<div class="chip-option ${sel}" data-pgroup="${key}" data-pfield="dropTF" data-val="${tf}">${tf}${isExact ? ' (exact zone)' : ''}</div>`;
    });
    h += `</div>`;
  }
  return h;
}

let confluenceState = {
  types: [],
  hns: { timeframe: null, fresh: null },
  tlMode: null,
  tl1: { timeframe: null, type: null },
  tl2: { timeframe: null, type: null }
};

function confluenceComplete() {
  if (confluenceState.types.length === 0) return false;
  if (confluenceState.types.includes('hns')) {
    if (!confluenceState.hns.timeframe || !confluenceState.hns.fresh) return false;
  }
  if (confluenceState.types.includes('tl')) {
    if (!confluenceState.tlMode) return false;
    if (!confluenceState.tl1.timeframe || !confluenceState.tl1.type) return false;
    if (confluenceState.tlMode === 'kiss') {
      if (!confluenceState.tl2.timeframe || !confluenceState.tl2.type) return false;
    }
  }
  return true;
}

function renderTLBlock(title, key) {
  const data = confluenceState[key];
  let h = `<div class="dir-field-label" style="margin-top:14px;">${title}</div>`;
  h += `<div class="dir-field">
    <div class="dir-field-label" style="font-size:12px;color:#5B6472;">Timeframe</div>
    <div class="chip-select">`;
  TF_OPTIONS.forEach(tf => {
    const sel = data.timeframe === tf ? 'selected' : '';
    h += `<div class="chip-option ${sel}" data-group="${key}" data-cfield="timeframe" data-val="${tf}">${tf}</div>`;
  });
  h += `</div></div>`;
  h += `<div class="dir-field">
    <div class="dir-field-label" style="font-size:12px;color:#5B6472;">Type</div>
    <div class="chip-select">`;
  TL_TYPES.forEach(t => {
    const sel = data.type === t ? 'selected' : '';
    h += `<div class="chip-option ${sel}" data-group="${key}" data-cfield="type" data-val="${t}">${t}</div>`;
  });
  h += `</div></div>`;
  return h;
}

function setupComplete() {
  if (!selectedSetupKey) return false;
  const def = SETUP_TYPES[selectedSetupKey];
  const data = setupState[selectedSetupKey];
  return def.fields.every(f => {
    if (f.showIf && !f.showIf(data)) return true;
    return !!data[f.key];
  });
}

function setupPoints(key) {
  const data = setupState[key];
  if (!data) return 0;
  const aligned = directionSetupAligned();
  const qmYes = data.qmSetup === 'Yes';
  const hslVal = key === 'bpe' ? data.hslAvailable : data.hsl;
  const hslYes = hslVal === 'Yes';

  let pts = 0;
  if (aligned) pts += GRADE_POINTS.alignment;
  if (qmYes) pts += GRADE_POINTS.qm;
  if (hslYes) pts += GRADE_POINTS.hsl;
  if (key === 'bpe' && data.zoneUsed2TF === 'No') pts += GRADE_POINTS.extra;
  if (key === 'bpe' && data.zoneUsed2TF === 'Yes') pts -= GRADE_POINTS.extra;
  if (GOOD_TIMEFRAMES.includes(data.timeframe)) pts += GRADE_POINTS.timeframe;
  return pts;
}

function setupGrade(key) {
  const def = SETUP_TYPES[key];
  const data = setupState[key];
  if (!def || !data) return null;

  const aligned = directionSetupAligned();
  const qmYes = data.qmSetup === 'Yes';
  const hslVal = key === 'bpe' ? data.hslAvailable : data.hsl;
  const hslYes = hslVal === 'Yes';

  if (aligned && qmYes && hslYes) return { label: 'A+ Golden', cls: 'golden' };
  if (qmYes && hslYes) return { label: 'A+', cls: 'aplus' };
  if (aligned || qmYes) return { label: 'A', cls: 'a' };

  const pts = setupPoints(key);
  if (pts > 0) return { label: pts + ' pts', cls: 'pts' };
  return null;
}

function setupSummary(key) {
  const def = SETUP_TYPES[key];
  const data = setupState[key];
  const activeFields = def.fields.filter(f => !f.showIf || f.showIf(data));
  const parts = activeFields.map(f => data[f.key]).filter(Boolean);
  if (parts.length === 0) return "Tap to configure";
  if (parts.length < activeFields.length) return "In progress — " + parts.join(" · ");
  return parts.join(" · ");
}

const dailyOpenStep = {
  title: "Daily open",
  sub: "Mark the session before you read anything else.",
  items: [
    "Vertical line drawn at the daily open on the running daily candle (AMD)",
    "Open line chart and mark all QM zones with HNS and Top/Bottom, from H4 down to M15"
  ]
};

const setupStep = {
  title: "Setup",
  sub: "Pick the setup that's actually present, then configure it.",
  type: "setup"
};

const zoneSizeStep = {
  title: "Zone size",
  sub: "How wide is the zone? This decides whether Precise applies.",
  type: "zonesize"
};

const preciseStep = {
  title: "Precise",
  sub: "How wide is the zone — decide whether to drop timeframe.",
  type: "precise"
};

const confluenceStep = {
  title: "Confluence",
  sub: "Pick every confluence that's present — HNS and TL can both apply.",
  type: "confluence"
};

const steps = [
  dailyOpenStep,
  directionStep,
  setupStep,
  zoneSizeStep,
  preciseStep,
  confluenceStep,
  {
    title: "Timing & risk",
    sub: "Last check before you actually click.",
    items: [
      "Entering in the middle of the candle window (e.g. 10:15–10:45 for an H1 candle)",
      "Stop loss set 10–20 pips beyond the zone",
      "Daily P/L is still inside limits (20% target / 7% max loss / 13% secondary)"
    ]
  }
];

let stepIndex = 0;
let checks = steps.map(s => s.items ? s.items.map(() => false) : []);
let pendingSaveStatus = 'marked';

const card = document.getElementById('card');
const rail = document.getElementById('rail');

function stepComplete(i) {
  const t = steps[i].type;
  if (t === 'direction') return Object.values(directionState).every(Boolean);
  if (t === 'setup') return setupComplete() && !(setupSide && directionAlignCount(setupSide) === 0);
  if (t === 'zonesize') return zoneSizeComplete();
  if (t === 'precise') return preciseComplete();
  if (t === 'confluence') return confluenceComplete();
  if (t === 'placeholder') return true;
  return checks[i].every(Boolean);
}

function stepStatus(i) {
  if (i === stepIndex) return 'current';
  if (i < stepIndex) return stepComplete(i) ? 'done' : 'fail';
  return '';
}

function renderRail() {
  rail.innerHTML = '';
  for (let i = 0; i < steps.length; i++) {
    const t = document.createElement('div');
    t.className = 'tick ' + stepStatus(i);
    rail.appendChild(t);
  }
  const verdictTick = document.createElement('div');
  verdictTick.className = 'tick ' + (stepIndex === steps.length ? 'current' : '');
  rail.appendChild(verdictTick);
}

function updateTopPoints() {
  const badge = document.getElementById('topPointsBadge');
  if (!badge) return;
  const step = steps[stepIndex];
  let activeKey = null;
  if (step && step.type === 'setup') {
    activeKey = setupDetailKey || selectedSetupKey;
  } else if (stepIndex >= steps.length) {
    activeKey = selectedSetupKey;
  }
  if (!activeKey) {
    badge.innerHTML = '';
    return;
  }
  const grade = setupGrade(activeKey);
  const pts = setupPoints(activeKey);
  const cls = grade ? grade.cls : 'pts';
  badge.innerHTML = `<span class="grade-badge ${cls} points-pill">${pts} PTS</span>`;
}

function renderStep() {
  const step = steps[stepIndex];
  const complete = stepComplete(stepIndex);

  let html = `<div class="step-count-row">`;
  html += `<div class="step-count">STEP ${stepIndex + 1} OF ${steps.length}</div>`;
  html += `</div>`;
  html += `<div class="step-title">${step.title}</div>`;
  html += `<div class="step-sub">${step.sub}</div>`;

  if (step.type === 'direction') {
    html += `<div>`;
    step.fields.forEach(f => {
      const current = directionState[f.key];
      html += `<div class="dir-field">
        <div class="dir-field-label">${f.label}</div>
        <div class="dir-cards">`;
      DIR_OPTIONS.forEach(opt => {
        const sel = current === opt.val ? 'sel-' + opt.val.toLowerCase() : '';
        html += `
          <div class="dir-card ${sel}" data-field="${f.key}" data-val="${opt.val}">
            <i class="ti ${opt.icon}" aria-hidden="true"></i>
            <span>${opt.val}</span>
          </div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  } else if (step.type === 'setup') {
    if (setupSide) {
      const alignCount = directionAlignCount(setupSide);
      if (alignCount === 0) {
        html += `<div class="risk-alert block-alert"><i class="ti ti-ban" aria-hidden="true"></i><span><strong>Blocked:</strong> 0 of 3 direction signals align with ${setupSide.toLowerCase()}. Change direction or setup side to continue.</span></div>`;
      } else if (alignCount === 1) {
        html += `<div class="risk-alert"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span><strong>Caution:</strong> only 1 of 3 direction signals align with ${setupSide.toLowerCase()}. Proceed carefully.</span></div>`;
      }
    }
    if (setupDetailKey) {
      const key = setupDetailKey;
      const def = SETUP_TYPES[key];
      const grade = setupGrade(key);
      html += `<div class="setup-detail-head" id="backToSetupList"><i class="ti ti-chevron-left" aria-hidden="true"></i><span>All setups</span></div>`;
      html += `<div class="setup-detail-title">${def.label}</div>`;
      html += `<div class="setup-detail-sub">${def.sub}</div>`;
      def.fields.forEach(f => {
        if (f.showIf && !f.showIf(setupState[key])) return;
        const current = setupState[key][f.key];
        html += `<div class="dir-field">
          <div class="dir-field-label">${f.label}</div>`;
        if (f.note) {
          html += `<div class="field-note">${f.note}</div>`;
        }
        html += `<div class="chip-select">`;
        f.options.forEach(opt => {
          const sel = current === opt ? 'selected' : '';
          html += `<div class="chip-option ${sel}" data-field="${f.key}" data-val="${opt}">${opt}</div>`;
        });
        html += `</div></div>`;
      });
    } else if (setupSide) {
      html += `<div class="setup-detail-head" id="backToSide"><i class="ti ti-chevron-left" aria-hidden="true"></i><span>${setupSide}</span></div>`;
      html += `<div class="setup-list">`;
      Object.keys(SETUP_TYPES).forEach(key => {
        const def = SETUP_TYPES[key];
        const isSel = selectedSetupKey === key;
        const grade = isSel ? setupGrade(key) : null;
        html += `
          <div class="setup-card ${isSel ? 'selected' : ''}" data-key="${key}">
            <div class="setup-icon"><i class="ti ${def.icon}" aria-hidden="true"></i></div>
            <div class="setup-mid">
              <div class="setup-name">${def.label}${grade ? `<span class="grade-badge ${grade.cls}">${grade.label}</span>` : ''}</div>
              <div class="setup-status">${isSel ? setupSummary(key) : 'Tap to configure'}</div>
            </div>
            <i class="ti ti-chevron-right setup-chevron" aria-hidden="true"></i>
          </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="side-cards">`;
      [
        { val: "Buy", icon: "ti-trending-up" },
        { val: "Sell", icon: "ti-trending-down" }
      ].forEach(opt => {
        const sel = setupSide === opt.val ? 'sel-' + opt.val.toLowerCase() : '';
        html += `
          <div class="side-card ${sel}" data-side="${opt.val}">
            <i class="ti ${opt.icon}" aria-hidden="true"></i>
            <span>${opt.val.toUpperCase()}</span>
          </div>`;
      });
      html += `</div>`;
    }
  } else if (step.type === 'zonesize') {
    html += `<div class="side-cards">`;
    [
      { val: "<=40", label: "40 PIPS OR LESS", icon: "ti-minimize" },
      { val: "50+", label: "50 PIPS +", icon: "ti-maximize" }
    ].forEach(opt => {
      const sel = zoneSizeState.size === opt.val ? 'selected' : '';
      html += `
        <div class="side-card ${sel}" data-zonesize="${opt.val}">
          <i class="ti ${opt.icon}" aria-hidden="true"></i>
          <span>${opt.label}</span>
        </div>`;
    });
    html += `</div>`;
    if (zoneSizeState.size === '<=40') {
      html += `<div class="field-note" style="margin-top:14px;">Zone is 40 pips or less — Precise step isn't needed. Skipping straight to Confluence.</div>`;
    } else if (zoneSizeState.size === '50+') {
      html += `<div class="field-note" style="margin-top:14px;">Zone is 50 pips or more — continue to Precise to lock the drop timeframe.</div>`;
    }
  } else if (step.type === 'precise') {
    html += `<div class="dir-field-label" style="margin-bottom:9px;">Precise type</div>`;
    html += `<div class="chip-select" style="margin-bottom:20px;">`;
    [
      { val: 'isl', label: 'ISL Precise' },
      { val: 'hns', label: 'HNS Precise' }
    ].forEach(opt => {
      const sel = preciseState.types.includes(opt.val) ? 'selected' : '';
      html += `<div class="chip-option ${sel}" data-pgroup="ptype" data-pfield="ptype" data-val="${opt.val}">${opt.label}</div>`;
    });
    html += `</div>`;

    if (preciseState.types.includes('isl')) {
      html += renderPreciseBlock('ISL Precise', 'isl', "ISL Zone SHOULD SAME IN PRECISE TF Zone, Don't Come Out from Zone");
    }
    if (preciseState.types.includes('hns')) {
      html += renderPreciseBlock('HNS Precise', 'hns', "HNS Zone SHOULD SAME IN PRECISE TF Zone, Don't Come Out from Zone");
    }
  } else if (step.type === 'confluence') {
    html += `<div class="dir-field-label" style="margin-bottom:9px;">Confluence type</div>`;
    html += `<div class="chip-select" style="margin-bottom:20px;">`;
    [
      { val: 'hns', label: 'HNS SNR' },
      { val: 'tl', label: 'TL' }
    ].forEach(opt => {
      const sel = confluenceState.types.includes(opt.val) ? 'selected' : '';
      html += `<div class="chip-option ${sel}" data-group="type" data-cfield="type" data-val="${opt.val}">${opt.label}</div>`;
    });
    html += `</div>`;

    if (confluenceState.types.includes('hns')) {
      html += `<div class="setup-detail-title">HNS SNR</div>`;
      html += `<div class="field-note">HNS will be V and A type, not M and W.</div>`;
      html += `<div class="dir-field">
        <div class="dir-field-label">Which timeframe</div>
        <div class="chip-select">`;
      TF_OPTIONS.forEach(tf => {
        const sel = confluenceState.hns.timeframe === tf ? 'selected' : '';
        html += `<div class="chip-option ${sel}" data-group="hns" data-cfield="timeframe" data-val="${tf}">${tf}</div>`;
      });
      html += `</div></div>`;
      html += `<div class="dir-field">
        <div class="dir-field-label">Fresh</div>
        <div class="chip-select">`;
      ['Yes', 'No'].forEach(v => {
        const sel = confluenceState.hns.fresh === v ? 'selected' : '';
        html += `<div class="chip-option ${sel}" data-group="hns" data-cfield="fresh" data-val="${v}">${v}</div>`;
      });
      html += `</div></div>`;
    }

    if (confluenceState.types.includes('tl')) {
      html += `<div class="setup-detail-title" style="margin-top:6px;">TL</div>`;
      html += `<div class="dir-field">
        <div class="dir-field-label">KISS or single</div>
        <div class="chip-select">`;
      [
        { val: 'kiss', label: 'KISS' },
        { val: 'single', label: 'Single' }
      ].forEach(opt => {
        const sel = confluenceState.tlMode === opt.val ? 'selected' : '';
        html += `<div class="chip-option ${sel}" data-group="tlMode" data-cfield="tlMode" data-val="${opt.val}">${opt.label}</div>`;
      });
      html += `</div></div>`;

      if (confluenceState.tlMode === 'kiss') {
        html += renderTLBlock('TL 1', 'tl1');
        html += renderTLBlock('TL 2', 'tl2');
      } else if (confluenceState.tlMode === 'single') {
        html += renderTLBlock('TL', 'tl1');
      }

      if (confluenceState.tlMode) {
        html += `<div class="field-note">If multi-timeframe KISS, entry from the LTF view.</div>`;
      }
    }
  } else if (step.type === 'placeholder') {
    html += `<div class="placeholder-box">Confluence checklist isn't defined yet.<br>Send the details and it'll be wired in here.</div>`;
  } else {
    html += `<div class="items">`;
    step.items.forEach((label, i) => {
      const isChecked = checks[stepIndex][i];
      html += `
        <div class="item ${isChecked ? 'checked' : ''}" data-idx="${i}">
          <div class="box"><i class="ti ti-check" aria-hidden="true"></i></div>
          <div class="item-label">${label}</div>
        </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="nav">`;
  if (stepIndex > 0) {
    html += `<button class="btn-back" id="backBtn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>`;
  }
  const isLast = stepIndex === steps.length - 1;
  html += `<button class="btn-next" id="nextBtn" ${complete ? '' : 'disabled'}>${isLast ? 'See verdict' : 'Next'}</button>`;
  html += `</div>`;

  card.innerHTML = html;
  updateTopPoints();

  if (step.type === 'direction') {
    card.querySelectorAll('.dir-card').forEach(el => {
      el.addEventListener('click', () => {
        const field = el.getAttribute('data-field');
        const val = el.getAttribute('data-val');
        directionState[field] = directionState[field] === val ? null : val;
        renderStep();
        renderRail();
        renderOverallBanner();
      });
    });
  } else if (step.type === 'setup') {
    if (setupDetailKey) {
      card.querySelectorAll('.chip-option').forEach(el => {
        el.addEventListener('click', () => {
          const field = el.getAttribute('data-field');
          const val = el.getAttribute('data-val');
          const key = setupDetailKey;
          setupState[key][field] = setupState[key][field] === val ? null : val;
          selectedSetupKey = key;
          renderStep();
          renderRail();
        });
      });
      const backToList = document.getElementById('backToSetupList');
      if (backToList) backToList.addEventListener('click', () => {
        setupDetailKey = null;
        renderStep();
      });
    } else if (setupSide) {
      card.querySelectorAll('.setup-card').forEach(el => {
        el.addEventListener('click', () => {
          setupDetailKey = el.getAttribute('data-key');
          renderStep();
        });
      });
      const backToSide = document.getElementById('backToSide');
      if (backToSide) backToSide.addEventListener('click', () => {
        setupSide = null;
        renderStep();
      });
    } else {
      card.querySelectorAll('.side-card').forEach(el => {
        el.addEventListener('click', () => {
          setupSide = el.getAttribute('data-side');
          renderStep();
        });
      });
    }
  } else if (step.type === 'zonesize') {
    card.querySelectorAll('[data-zonesize]').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.getAttribute('data-zonesize');
        zoneSizeState.size = zoneSizeState.size === val ? null : val;
        if (zoneSizeState.size !== '50+') {
          preciseState = { types: [], isl: { dropTF: null }, hns: { dropTF: null } };
        }
        renderStep();
        renderRail();
      });
    });
  } else if (step.type === 'precise') {
    card.querySelectorAll('[data-pgroup]').forEach(el => {
      el.addEventListener('click', () => {
        const group = el.getAttribute('data-pgroup');
        const val = el.getAttribute('data-val');
        if (group === 'ptype') {
          const idx = preciseState.types.indexOf(val);
          if (idx >= 0) preciseState.types.splice(idx, 1);
          else preciseState.types.push(val);
        } else {
          const field = el.getAttribute('data-pfield');
          if (field === 'zoneSize') {
            preciseState[group].zoneSize = preciseState[group].zoneSize === val ? null : val;
          } else {
            preciseState[group][field] = preciseState[group][field] === val ? null : val;
          }
        }
        renderStep();
        renderRail();
      });
    });
  } else if (step.type === 'confluence') {
    card.querySelectorAll('[data-group]').forEach(el => {
      el.addEventListener('click', () => {
        const group = el.getAttribute('data-group');
        const val = el.getAttribute('data-val');
        if (group === 'type') {
          const idx = confluenceState.types.indexOf(val);
          if (idx >= 0) confluenceState.types.splice(idx, 1);
          else confluenceState.types.push(val);
        } else if (group === 'tlMode') {
          confluenceState.tlMode = confluenceState.tlMode === val ? null : val;
        } else {
          const field = el.getAttribute('data-cfield');
          confluenceState[group][field] = confluenceState[group][field] === val ? null : val;
        }
        renderStep();
        renderRail();
      });
    });
  } else if (step.type === 'placeholder') {
    // no interactive elements
  } else {
    card.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        checks[stepIndex][idx] = !checks[stepIndex][idx];
        renderStep();
        renderRail();
      });
    });
  }

  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (!stepComplete(stepIndex)) return;
      const target = nextStepIndex(stepIndex);
      if (target < steps.length) {
        stepIndex = target;
        renderStep();
        renderRail();
      } else {
        stepIndex = steps.length;
        renderVerdict();
        renderRail();
      }
    });
  }

  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      if (step.type === 'setup') {
        if (setupDetailKey) {
          setupDetailKey = null;
          renderStep();
          renderRail();
          return;
        }
        if (setupSide) {
          setupSide = null;
          renderStep();
          renderRail();
          return;
        }
      }
      stepIndex = prevStepIndex(stepIndex);
      renderStep();
      renderRail();
    });
  }
}

function nextStepIndex(from) {
  let i = from + 1;
  if (steps[i] && steps[i].type === 'precise' && !preciseNeeded()) i++;
  return i;
}

function prevStepIndex(from) {
  let i = from - 1;
  if (steps[i] && steps[i].type === 'precise' && !preciseNeeded()) i--;
  return i;
}

function renderVerdict() {
  const failedSteps = [];
  steps.forEach((step, si) => {
    if (!step.items) return;
    step.items.forEach((label, ii) => {
      if (!checks[si][ii]) failedSteps.push({ step: step.title, label });
    });
  });
  if (!setupComplete()) {
    failedSteps.unshift({ step: "Setup", label: selectedSetupKey ? "Finish configuring " + SETUP_TYPES[selectedSetupKey].label : "No setup selected" });
  }
  if (!zoneSizeComplete()) {
    failedSteps.unshift({ step: "Zone size", label: "No zone size selected" });
  }
  if (!preciseComplete()) {
    let preciseLabel = "No precise type selected";
    if (preciseState.types.length > 0) {
      const badType = preciseState.types.find(t => {
        const d = preciseState[t];
        return !d.dropTF;
      });
      if (badType) {
        const name = badType === 'isl' ? 'ISL' : 'HNS';
        preciseLabel = `${name}: select the drop timeframe (2 TF below)`;
      }
    }
    failedSteps.unshift({ step: "Precise", label: preciseLabel });
  }
  if (!confluenceComplete()) {
    failedSteps.unshift({ step: "Confluence", label: confluenceState.types.length === 0 ? "No confluence type selected" : "Finish configuring the selected confluence" });
  }
  const bias = overallBias();
  const biasMixed = bias.cls === 'mixed' || bias.cls === 'pending';
  const isGo = failedSteps.length === 0 && !biasMixed;

  let html = `<div class="verdict">`;
  html += `<div class="verdict-badge ${isGo ? 'go' : 'nogo'}">${isGo ? 'GO' : 'NO GO'}</div>`;
  let subText;
  if (isGo) subText = `Direction ${bias.label.toLowerCase()}, every check passed.`;
  else if (biasMixed) subText = `Direction isn't aligned (${bias.sub.toLowerCase()}) — resolve before entering.`;
  else subText = failedSteps.length + ' item' + (failedSteps.length > 1 ? 's' : '') + ' unconfirmed — resolve before entering.';
  html += `<div class="verdict-sub">${subText}</div>`;
  const vMeta = nowMeta();
  html += `<div class="verdict-sub" style="margin-top:-14px;font-family:'JetBrains Mono', monospace;font-size:11px;color:#5B6472;">${vMeta.date} · ${vMeta.day} · ${vMeta.time}</div>`;

  const score = tradeScore();
  const scoreInfo = tradeScoreClass(score);
  const breakdown = tradeScoreBreakdown();
  html += `<div class="score-panel">
    <div class="score-panel-head">
      <div>
        <div class="score-panel-title">Trade score</div>
        <div class="score-total">${score} / ${TRADE_SCORE_MAX} pts</div>
      </div>
      <div class="score-badge ${scoreInfo.cls}">${scoreInfo.label}</div>
    </div>
    ${breakdown.map(b => `<div class="score-row"><span>${b.label}</span><span class="score-row-pts ${b.pts > 0 ? 'earned' : ''}">${b.pts}/${b.max}</span></div>`).join('')}
  </div>`;

  if (!isGo) {
    html += `<div class="fail-list">`;
    if (biasMixed) {
      html += `<div class="fail-item"><i class="ti ti-x" aria-hidden="true"></i><span><strong>Direction:</strong> ${bias.sub}</span></div>`;
    }
    failedSteps.forEach(f => {
      html += `<div class="fail-item"><i class="ti ti-x" aria-hidden="true"></i><span><strong>${f.step}:</strong> ${f.label}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="reminder-block">
    <div class="reminder-title">On the way out</div>
    <div class="reminder-row"><span>Take profit</span><span>Next opposite setup / roadblock / fresh ISL</span></div>
    <div class="reminder-row"><span>Cut loss</span><span>Body candle break or confluence fail</span></div>
    <div class="reminder-row"><span>Stop loss</span><span>10–20 pips beyond zone</span></div>
  </div>`;

  if (isGo) {
    html += `<div class="journal-save-block" id="journalSaveBlock">
      <div class="journal-save-title">Save to journal</div>
      <div class="dir-field-label" style="margin-bottom:9px;">Status</div>
      <div class="chip-select" id="saveStatusChips" style="margin-bottom:16px;">
        <div class="chip-option ${pendingSaveStatus === 'marked' ? 'selected' : ''}" data-save-status="marked">Marked</div>
        <div class="chip-option ${pendingSaveStatus === 'open' ? 'selected' : ''}" data-save-status="open">Open</div>
        <div class="chip-option ${pendingSaveStatus === 'closed' ? 'selected' : ''}" data-save-status="closed">Closed</div>
      </div>
      <div class="field-note" style="margin-bottom:10px;">Pair, risk, entry/SL/TP, and confluence can all be filled in later from the journal page.</div>
      <button class="btn-next go" id="saveJournalBtn" style="width:100%;">Save</button>
    </div>`;
  } else {
    html += `<button class="btn-next reset" id="logSkipBtn" style="width:100%;margin-bottom:10px;">Log as skipped (no entry)</button>`;
  }

  html += `<button class="btn-next reset" id="resetBtn" style="width:100%">Start new check</button>`;
  html += `</div>`;

  card.innerHTML = html;
  updateTopPoints();

  if (isGo) {
    document.getElementById('saveStatusChips').querySelectorAll('[data-save-status]').forEach(el => {
      el.addEventListener('click', () => {
        pendingSaveStatus = el.getAttribute('data-save-status');
        document.getElementById('saveStatusChips').querySelectorAll('[data-save-status]').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
    document.getElementById('saveJournalBtn').addEventListener('click', () => {
      const entry = buildJournalEntry('GO', pendingSaveStatus);
      addJournalEntry(entry);
      pendingSaveStatus = 'marked';
      const block = document.getElementById('journalSaveBlock');

/* =====================================================
   JOURNAL SYSTEM — local storage persistence
   ===================================================== */
const JOURNAL_KEY = 'preTradeJournal_v1';

function getJournal() {
  try {
    const raw = localStorage.getItem(JOURNAL_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function setJournalArr(arr) {
  try {
    localStorage.setItem(JOURNAL_KEY, JSON.stringify(arr));
    return true;
  } catch (e) {
    return false;
  }
}

function addJournalEntry(entry) {
  const arr = getJournal();
  arr.unshift(entry);
  setJournalArr(arr);
  updateNavCount();
}

function updateJournalEntry(id, patch) {
  const arr = getJournal();
  const idx = arr.findIndex(e => e.id === id);
  if (idx > -1) {
    arr[idx] = Object.assign({}, arr[idx], patch);
    setJournalArr(arr);
  }
}

function deleteJournalEntry(id) {
  const arr = getJournal().filter(e => e.id !== id);
  setJournalArr(arr);
  updateNavCount();
}

function makeId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

function nowMeta() {
  const d = new Date();
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const pad = n => String(n).padStart(2, '0');
  return {
    createdAt: d.toISOString(),
    timestamp: d.getTime(),
    date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    day: days[d.getDay()],
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    hour: d.getHours()
  };
}

function setupFieldSummary(key) {
  if (!key) return [];
  const def = SETUP_TYPES[key];
  const data = setupState[key];
  return def.fields
    .filter(f => !f.showIf || f.showIf(data))
    .map(f => ({ label: f.label, value: data[f.key] || null }));
}

function buildJournalEntry(verdictType, statusValue) {
  const bias = overallBias();
  const meta = nowMeta();
  return {
    id: makeId(),
    createdAt: meta.createdAt,
    timestamp: meta.timestamp,
    date: meta.date,
    day: meta.day,
    time: meta.time,
    hour: meta.hour,
    verdict: verdictType,
    status: verdictType === 'GO' ? (statusValue || 'marked') : null,
    direction: {
      h4tl: directionState.h4tl,
      h4bo: directionState.h4bo,
      h1structure: directionState.h1structure,
      biasLabel: bias.label,
      biasSub: bias.sub
    },
    side: setupSide || null,
    setupType: selectedSetupKey || null,
    setupTypeLabel: selectedSetupKey ? SETUP_TYPES[selectedSetupKey].label : null,
    setupFields: setupFieldSummary(selectedSetupKey),
    setupGrade: selectedSetupKey ? setupGrade(selectedSetupKey) : null,
    setupPoints: selectedSetupKey ? setupPoints(selectedSetupKey) : null,
    tradeScore: tradeScore(),
    tradeScoreMax: TRADE_SCORE_MAX,
    tradeScoreLabel: tradeScoreClass(tradeScore()),
    zoneSize: zoneSizeState.size,
    precise: JSON.parse(JSON.stringify(preciseState)),
    confluence: JSON.parse(JSON.stringify(confluenceState)),
    dailyOpenChecks: steps[0].items.map((label, i) => ({ label, done: !!checks[0][i] })),
    timingRiskChecks: steps[steps.length - 1].items.map((label, i) => ({ label, done: !!checks[steps.length - 1][i] })),
    trade: {
      symbol: '',
      entryPrice: null,
      stopLoss: null,
      takeProfit: null,
      riskPercent: null,
      notes: ''
    },
    outcome: { status: 'open', exitPrice: null, pnl: null, rMultiple: null, closedAt: null, notes: '' }
  };
}

function updateNavCount() {
  const el = document.getElementById('navCount');
  if (!el) return;
  const n = getJournal().length;
  el.textContent = n > 0 ? String(n) : '';
}

  if (view === 'journal') renderJournalDashboard();

function rangeCutoff(range) {
  if (range === 'all') return 0;
  const days = { '7': 7, '30': 30, '90': 90 }[range] || 0;
  return Date.now() - days * 24 * 60 * 60 * 1000;
}

function filteredEntries() {
  const cutoff = rangeCutoff(journalFilters.range);
  return getJournal().filter(e => {
    if (e.timestamp < cutoff) return false;
    if (journalFilters.setup !== 'all' && e.setupType !== journalFilters.setup) return false;
    if (journalFilters.side !== 'all' && e.side !== journalFilters.side) return false;
    if (journalFilters.verdict !== 'all' && e.verdict !== (journalFilters.verdict === 'go' ? 'GO' : 'NO GO')) return false;
    return true;
  });
}

function computeStats(entries) {
  const trades = entries.filter(e => e.verdict === 'GO');
  const closed = trades.filter(e => e.outcome && (e.outcome.status === 'win' || e.outcome.status === 'loss' || e.outcome.status === 'breakeven'));
  const wins = closed.filter(e => e.outcome.status === 'win');
  const losses = closed.filter(e => e.outcome.status === 'loss');
  const breakeven = closed.filter(e => e.outcome.status === 'breakeven');
  const open = trades.filter(e => !e.outcome || e.outcome.status === 'open');
  const winRate = (wins.length + losses.length) > 0 ? (wins.length / (wins.length + losses.length)) * 100 : null;
  const pnlEntries = trades.filter(e => e.outcome && typeof e.outcome.pnl === 'number');
  const totalPnl = pnlEntries.reduce((s, e) => s + e.outcome.pnl, 0);
  const rEntries = trades.filter(e => e.outcome && typeof e.outcome.rMultiple === 'number');
  const avgR = rEntries.length > 0 ? rEntries.reduce((s, e) => s + e.outcome.rMultiple, 0) / rEntries.length : null;
  const skipped = entries.filter(e => e.verdict === 'NO GO').length;

  // current streak (based on chronological closed trades, most recent first)
  const chronClosed = closed.slice().sort((a, b) => b.timestamp - a.timestamp);
  let streak = 0, streakType = null;
  for (const e of chronClosed) {
    if (e.outcome.status === 'breakeven') break;
    if (streakType === null) { streakType = e.outcome.status; streak = 1; }
    else if (e.outcome.status === streakType) streak++;
    else break;
  }

  return { trades, closed, wins, losses, breakeven, open, winRate, totalPnl, avgR, skipped, streak, streakType, pnlEntries };
}

function fmtNum(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

    document.body.appendChild(a);

    URL.revokeObjectURL(url);

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('bad format');
        const existing = getJournal();
        const existingIds = new Set(existing.map(e => e.id));
        const merged = existing.concat(imported.filter(e => e && e.id && !existingIds.has(e.id)));
        setJournalArr(merged);
        updateNavCount();
        renderJournalDashboard();
      } catch (e) {
        alert('Could not read that file — expecting the JSON export from this journal.');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    if (getJournal().length === 0) return;
    if (confirm('Delete every journal entry on this device? This cannot be undone. Export a backup first if you want to keep them.')) {
      setJournalArr([]);
      updateNavCount();
      renderJournalDashboard();
    }
  });

function renderCharts(entries, stats) {
  // 1. Equity curve
  const pnlChron = stats.trades
    .filter(e => e.outcome && typeof e.outcome.pnl === 'number')

  chartInstances.equity = new Chart(document.getElementById('chartEquity'), {
    type: 'line',

      labels: equityLabels.length ? equityLabels : ['—'],

        borderColor: '#D9832E',
        backgroundColor: 'rgba(44,123,229,0.12)',
        fill: true,
        tension: 0.25,
        pointRadius: 2,
        pointBackgroundColor: '#D9832E'
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: baseAxisOpts()
    }
  });

  // 2. Win / Loss / Breakeven donut
  chartInstances.outcome = new Chart(document.getElementById('chartOutcome'), {
    type: 'doughnut',
    data: {
      labels: ['Win', 'Loss', 'Breakeven', 'Open'],
      datasets: [{
        data: [stats.wins.length, stats.losses.length, stats.breakeven.length, stats.open.length],
        backgroundColor: ['#34C97F', '#F2565C', '#E8B34A', '#3A4150'],
        borderColor: '#14181F',
        borderWidth: 2
      }]
    },
    options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12 } } }, cutout: '62%' }
  });

  // 3. Win rate by setup type
  const setupKeys = ['bpe', 'hns', 'tl'];
  const setupLabels = setupKeys.map(k => SETUP_TYPES[k].label);
  const setupWinRates = setupKeys.map(k => {
    const g = stats.closed.filter(e => e.setupType === k && e.outcome.status !== 'breakeven');
    if (g.length === 0) return 0;
    return (g.filter(e => e.outcome.status === 'win').length / g.length) * 100;
  });
  const setupCounts = setupKeys.map(k => stats.trades.filter(e => e.setupType === k).length);
  chartInstances.bySetup = new Chart(document.getElementById('chartBySetup'), {
    type: 'bar',
    data: {
      labels: setupLabels.map((l, i) => `${l} (${setupCounts[i]})`),
      datasets: [{ data: setupWinRates, backgroundColor: '#D9832E', borderRadius: 6, maxBarThickness: 46 }]
    },
    options: { plugins: { legend: { display: false } }, scales: Object.assign(baseAxisOpts(), { y: Object.assign(baseAxisOpts().y, { max: 100 }) }) }
  });

  // 4. Win rate by direction bias
  const biasKeys = ['Bullish', 'Bearish', 'Sideways', 'Mixed'];
  const biasWinRates = biasKeys.map(b => {
    const g = stats.closed.filter(e => e.direction.biasLabel === b && e.outcome.status !== 'breakeven');
    if (g.length === 0) return 0;
    return (g.filter(e => e.outcome.status === 'win').length / g.length) * 100;
  });
  const biasCounts = biasKeys.map(b => stats.trades.filter(e => e.direction.biasLabel === b).length);
  chartInstances.byBias = new Chart(document.getElementById('chartByBias'), {
    type: 'bar',
    data: {
      labels: biasKeys.map((l, i) => `${l} (${biasCounts[i]})`),
      datasets: [{ data: biasWinRates, backgroundColor: '#34C97F', borderRadius: 6, maxBarThickness: 46 }]
    },
    options: { plugins: { legend: { display: false } }, scales: Object.assign(baseAxisOpts(), { y: Object.assign(baseAxisOpts().y, { max: 100 }) }) }
  });

  // 5. Trades by day of week
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    type: 'bar',
    data: {

    },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: baseAxisOpts() }

  if (st === 'closed') {
    if (o.status && o.status !== 'open') {
      const label = { win: 'Win', loss: 'Loss', breakeven: 'B/E' }[o.status] || 'Closed';
      return `<span class="tag ${o.status}">${label}</span>`;

    return `<span class="tag closed">Closed</span>`;

  // open
  const label = { open: 'Open', win: 'Win', loss: 'Loss', breakeven: 'B/E' }[o.status] || 'Open';
  return `<span class="tag ${o.status || 'open'}">${label}</span>`;
}
